[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yatracanvas-datafactory"
version = "0.1.0"
description = "Autonomous, open-data-driven city dataset generator for travel planning"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "YatraCanvas Team" }
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "pandas>=2.2.0",
    "pillow>=10.3.0",
    "rapidfuzz>=3.8.0",
    "shapely>=2.0.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "overturemaps>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
datafactory = "datafactory.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["datafactory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

# Approved inference only. Account billing must independently be confirmed free.
prompt_version: "2026-10-02.1"
providers:
  groq:
    model: qwen/qwen3.8-27b
    free_models: [qwen/qwen3.8-27b]
    fallback_models: []
    max_images: 3
    endpoint: https://api.groq.com/openai/v1
  gemini:
    model: gemini-3.8-flash
    free_models: [gemini-3.8-flash, gemini-3.5-flash-lite]
    fallback_models: [gemini-3.5-flash-lite]
    max_images: 3
    endpoint: https://generativelanguage.googleapis.com/v1beta
limits:
  calls: 30
  vision_calls: 20
  escalations: 5
  timeout_seconds: 25
  max_retry_delay_seconds: 10
  deferred_retry_seconds: 3600
  min_call_interval_seconds: 3
